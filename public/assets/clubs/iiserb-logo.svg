<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- IISER Bhopal Emblem Style Logo -->
  <g>
    <!-- Crest Base / Shield -->
    <rect x="2" y="6" width="48" height="48" rx="8" fill="#161616" stroke="#4589FF" stroke-width="1.5"/>
    <circle cx="26" cy="30" r="18" fill="#0B0E14" stroke="#BE95FF" stroke-width="1"/>
    <!-- Central Science / Atom Motif -->
    <ellipse cx="26" cy="30" rx="14" ry="5" stroke="#4589FF" stroke-width="1" transform="rotate(30 26 30)"/>
    <ellipse cx="26" cy="30" rx="14" ry="5" stroke="#FF7EB6" stroke-width="1" transform="rotate(-30 26 30)"/>
    <circle cx="26" cy="30" r="3" fill="#FFFFFF"/>
    <!-- IISER B text -->
    <text x="60" y="27" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" letter-spacing="0.05em">IISER BHOPAL</text>
    <text x="60" y="42" fill="#BDCDEF" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="10" letter-spacing="0.08em">DEPARTMENT OF EECS &amp; PHYSICS</text>
  </g>
</svg>
